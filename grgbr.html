<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Date?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background decorative floating heart layer -->
    <div class="heart-container" id="heartContainer"></div>

    <!-- The Romantic Card -->
    <div class="popup-box">
        <!-- Cute emoji header -->
        <div class="emoji-container">🥰</div>
        
        <h1 class="main-title">Will you be my date?</h1>
        <p class="sub-title">There's something perfect about you... so I made this...</p>

        <!-- Dynamic Action Buttons -->
        <div class="button-group">
            <button id="yesBtn">Yes, I'd love to! 💖</button>
            <button id="noBtn">No 🥺</button>
        </div>
        
        <div class="footer-note">For fine print and terms of matching, contact admin 😉</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
